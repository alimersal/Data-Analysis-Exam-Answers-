<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(91, 156, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(91, 156, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(123, 111, 240, 0.18)" />
      <stop offset="100%" stop-color="rgba(123, 111, 240, 0.05)" />
    </linearGradient>
    <linearGradient id="goldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(242, 200, 17, 0.18)" />
      <stop offset="100%" stop-color="rgba(242, 200, 17, 0.05)" />
    </linearGradient>
    <linearGradient id="mintBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(62, 207, 142, 0.18)" />
      <stop offset="100%" stop-color="rgba(62, 207, 142, 0.05)" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(240, 160, 48, 0.18)" />
      <stop offset="100%" stop-color="rgba(240, 160, 48, 0.05)" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5b9cff" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7b6ff0" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f0a030" />
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3ecf8e" />
    </marker>

    <!-- Filter Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; }
    .icon { font-size: 16px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1186" height="256" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Grid decoration lines subtle -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="65" x2="1190" y2="65" stroke-dasharray="4,4"/>
    <line x1="0" y1="130" x2="1190" y2="130" stroke-dasharray="4,4"/>
    <line x1="0" y1="195" x2="1190" y2="195" stroke-dasharray="4,4"/>
  </g>

  <!-- CONNECTIONS / ARROWS -->
  <!-- 1. Raw Data -> Excel Cleaning -->
  <line x1="175" y1="130" x2="216" y2="130" stroke="#5b9cff" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- 2. Excel Cleaning -> Data Modeling -->
  <line x1="365" y1="130" x2="406" y2="130" stroke="#5b9cff" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- 3. Data Modeling -> Power BI (Branch Up) -->
  <path d="M 555 115 C 575 115, 575 70, 595 70" fill="none" stroke="#7b6ff0" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- 4. Data Modeling -> HTML Dashboard (Branch Down) -->
  <path d="M 555 145 C 575 145, 575 190, 595 190" fill="none" stroke="#7b6ff0" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- 5. Power BI -> Business Insights (Merge Down) -->
  <path d="M 760 70 C 780 70, 780 115, 800 115" fill="none" stroke="#f0a030" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 6. HTML Dashboard -> Business Insights (Merge Up) -->
  <path d="M 760 190 C 780 190, 780 145, 800 145" fill="none" stroke="#f0a030" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- 7. Business Insights -> Delivered Value -->
  <line x1="955" y1="130" x2="996" y2="130" stroke="#3ecf8e" stroke-width="2" marker-end="url(#arrowMint)" />

  <!-- ================= NODES ================= -->

  <!-- Node 1: Raw WWI Data -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="98" width="150" height="64" rx="12" fill="url(#blueBox)" stroke="#5b9cff" stroke-width="1.8" />
    <text x="100" y="125" text-anchor="middle" class="title-text">🗂️ Raw WWI Data</text>
    <text x="100" y="145" text-anchor="middle" class="sub-text">Initial Sales Dataset</text>
  </g>

  <!-- Node 2: Excel Cleaning -->
  <g filter="url(#cardShadow)">
    <rect x="215" y="98" width="150" height="64" rx="12" fill="url(#blueBox)" stroke="#5b9cff" stroke-width="1.8" />
    <text x="290" y="125" text-anchor="middle" class="title-text">🧹 Excel Cleaning</text>
    <text x="290" y="145" text-anchor="middle" class="sub-text">EDA &amp; Nulls Fixed</text>
  </g>

  <!-- Node 3: Data Modeling -->
  <g filter="url(#cardShadow)">
    <rect x="405" y="98" width="150" height="64" rx="12" fill="url(#purpleBox)" stroke="#7b6ff0" stroke-width="1.8" />
    <text x="480" y="125" text-anchor="middle" class="title-text">📐 Data Modeling</text>
    <text x="480" y="145" text-anchor="middle" class="sub-text">Star Schema &amp; DAX</text>
  </g>

  <!-- Node 4A: Power BI Report (Top Branch) -->
  <g filter="url(#cardShadow)">
    <rect x="595" y="38" width="165" height="64" rx="12" fill="url(#goldBox)" stroke="#F2C811" stroke-width="1.8" />
    <text x="677" y="65" text-anchor="middle" class="title-text">📊 Power BI Report</text>
    <text x="677" y="85" text-anchor="middle" class="sub-text">4 Interactive Pages</text>
  </g>

  <!-- Node 4B: HTML Dashboard (Bottom Branch) -->
  <g filter="url(#cardShadow)">
    <rect x="595" y="158" width="165" height="64" rx="12" fill="url(#mintBox)" stroke="#3ecf8e" stroke-width="1.8" />
    <text x="677" y="185" text-anchor="middle" class="title-text">💻 HTML Dashboard</text>
    <text x="677" y="205" text-anchor="middle" class="sub-text">Live Web Analytics</text>
  </g>

  <!-- Node 5: Business Insights -->
  <g filter="url(#cardShadow)">
    <rect x="800" y="98" width="155" height="64" rx="12" fill="url(#amberBox)" stroke="#f0a030" stroke-width="1.8" />
    <text x="877" y="125" text-anchor="middle" class="title-text">💡 Business Insights</text>
    <text x="877" y="145" text-anchor="middle" class="sub-text">KPIs &amp; Trend Analysis</text>
  </g>

  <!-- Node 6: Delivered Value -->
  <g filter="url(#cardShadow)">
    <rect x="995" y="98" width="165" height="64" rx="12" fill="url(#mintBox)" stroke="#3ecf8e" stroke-width="2" />
    <text x="1077" y="125" text-anchor="middle" class="title-text">✅ Delivered Value</text>
    <text x="1077" y="145" text-anchor="middle" class="sub-text">Actionable Growth</text>
  </g>
</svg>
